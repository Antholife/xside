name: Idea or suggestion
description: Suggest a feature or an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make XSide better! 💡 Every idea is read, big or small.
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like XSide to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: The problem it solves, or the moment you missed it.
  - type: textarea
    id: more
    attributes:
      label: Anything else?
      description: Screenshots, mockups, apps that do it well…
