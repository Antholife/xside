name: Fix request
description: An app crashes or misbehaves after installing it with XSide — ask for a compatibility fix
title: "Fix request: "
labels: [fix-request]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for telling us! 🔧 The **Why does it crash?** window in XSide opens this form with most of it filled in.
        Please keep it free of personal details: no Apple ID, device names or UDIDs.
  - type: input
    id: app
    attributes:
      label: App name and version
      placeholder: YouTube 20.10
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where does the .ipa come from?
      options:
        - My own app
        - App Store app I decrypted myself
        - Open-source build
        - Other
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device model and iOS version
      placeholder: iPhone 17 Pro, iOS 27.2
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: XSide version
      description: Settings > About.
      placeholder: 1.0.2 (60)
    validations:
      required: true
  - type: dropdown
    id: symptom
    attributes:
      label: What happens?
      options:
        - Crashes at launch
        - Crashes later
        - Doesn't work right
        - Other
    validations:
      required: true
  - type: textarea
    id: diagnosis
    attributes:
      label: XSide's crash diagnosis
      description: Paste the text from "Why does it crash?" — it's already sanitized (device, account and personal identifiers are masked).
  - type: checkboxes
    id: fixes
    attributes:
      label: XSide fixes turned on
      options:
        - label: XSide module
        - label: iPhone Duo compatibility
        - label: Simulate signed-out iCloud
        - label: None
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happens instead
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed personal data (Apple ID, device names, UDIDs)
          required: true
